name: 'SARIF-to-CSV'
description: 'Create .csv files from sarif-formatted files'
author: 'Brad Sherman (@mr-sherman)'

inputs:
  input-file:
    description: 'sarif-formatted input file'
    required: false
    default: 'results.sarif'
  output-file:
    description: 'CSV-formatted output file'
    required: false
    default: 'results.csv'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Convert SARIF to CSV
      shell: bash
      run: |
        python3 "${{ github.action_path }}/main.py" \
          --input-file "${{ inputs.input-file }}" \
          --output-file "${{ inputs.output-file }}"
