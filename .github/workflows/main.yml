on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    name: unit tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  sarif_to_csv:
    runs-on: ubuntu-latest
    name: test sarif to csv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Convert sarif to csv
        id: sarif-to-csv
        uses: ./
        with:
          input-file: 'test/results.sarif'
          output-file: 'results.csv'
      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: 'results.csv'
          path: 'results.csv'

